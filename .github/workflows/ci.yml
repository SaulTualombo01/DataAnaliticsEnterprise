name: Verificación del monolito y frontend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-contracts.txt
      - run: python -m pip install -r tools/requirements-contracts.txt
      - run: python tools/validar_contratos.py
      - run: python -m unittest discover -s tools/tests -p test_tc13_mock.py -v
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven
          cache-dependency-path: DataAnaliticsEnterprise/pom.xml
      - name: Compilar para Java 23 y ejecutar pruebas sin PostgreSQL
        run: mvn -B -ntp -f DataAnaliticsEnterprise/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Pruebas de navegación y estados con API simulada
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-frontend
          path: Frontend/test-results
          retention-days: 7
