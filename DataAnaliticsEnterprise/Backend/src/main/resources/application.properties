spring.application.name=DataAnaliticsEnterprise
# Configuración local: ejecutar desde raíz del repositorio o módulo Maven.
# El archivo del módulo prevalece; variables del proceso conservan prioridad.
spring.config.import=optional:file:./.env[.properties][encoding=utf-8],optional:file:./DataAnaliticsEnterprise/.env[.properties][encoding=utf-8]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=TICSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
server.tomcat.max-http-form-post-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
tic.auth.absolute-session-timeout=${SESSION_ABSOLUTE_TIMEOUT:8h}
tic.auth.login-window=${LOGIN_WINDOW:15m}
tic.auth.login-account-limit=${LOGIN_ACCOUNT_LIMIT:5}
tic.auth.login-ip-limit=${LOGIN_IP_LIMIT:50}
tic.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
tic.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
tic.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:Administrador inicial}
tic.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

tic.accounts.invitation-ttl=${INVITATION_TTL:24h}
tic.accounts.manual-delivery-enabled=${INVITATION_MANUAL_DELIVERY_ENABLED:false}
tic.accounts.activation-window=${ACTIVATION_WINDOW:15m}
tic.accounts.activation-ip-limit=${ACTIVATION_IP_LIMIT:30}

# TC-11: claves AES-256 Base64 del entorno; sin claves falla cerrado.
tic.secrets.key-ids=${TIC_SECRETS_KEY_IDS:}
tic.secrets.active-key-id=${TIC_SECRETS_ACTIVE_KEY_ID:}
tic.secrets.allow-local-insecure=${TIC_SECRETS_ALLOW_LOCAL_INSECURE:false}
