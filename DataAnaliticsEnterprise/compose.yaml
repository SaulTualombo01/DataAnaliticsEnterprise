name: m2-calidad
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: m2_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${M2_POSTGRES_PASSWORD:?Ejecuta primero preparar-docker.ps1}
      M2_DB_PASSWORD: ${M2_DB_PASSWORD:?Ejecuta primero preparar-docker.ps1}
    volumes:
      - m2_database:/var/lib/postgresql/data
      - ./Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/init-db.sh:/docker-entrypoint-initdb.d/01-m2.sh:ro
      - ./Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/schema-local.sql:/m2/schema-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d m2_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  database-migration:
    image: postgres:17
    environment:
      PGPASSWORD: ${M2_POSTGRES_PASSWORD:?Ejecuta primero preparar-docker.ps1}
    command: ["sh", "/m2/migrate-db.sh"]
    volumes:
      - ./Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/migrate-role-revocation.sql:/m2/migrate-role-revocation.sql:ro
      - ./Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/migrate-operational-limits.sql:/m2/migrate-operational-limits.sql:ro
      - ./Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/migrate-db.sh:/m2/migrate-db.sh:ro
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  application:
    image: ${M2_APPLICATION_IMAGE:-m2-calidad-application}
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=67108864
    build:
      context: .
      dockerfile: Backend/src/main/java/org/dataanaliticsent/Calidad/Docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      M2_DB_JDBC_URL: jdbc:postgresql://database:5432/m2_local
      M2_DB_USERNAME: m2_app
      M2_DB_PASSWORD: ${M2_DB_PASSWORD:?Ejecuta primero preparar-docker.ps1}
      M2_DATA_KEY_ID: ${M2_DATA_KEY_ID:-local-v1}
      M2_DATA_KEY_BASE64: ${M2_DATA_KEY_BASE64:?Ejecuta primero preparar-docker.ps1}
      M2_EMAIL_LOOKUP_KEY_BASE64: ${M2_EMAIL_LOOKUP_KEY_BASE64:?Ejecuta primero preparar-docker.ps1}
      M2_BOOTSTRAP_ADMIN_PASSWORD: ${M2_ADMIN_PASSWORD:?Ejecuta primero preparar-docker.ps1}
      M2_BOOTSTRAP_QUALITY_PASSWORD: ${M2_QUALITY_PASSWORD:?Ejecuta primero preparar-docker.ps1}
      M2_BOOTSTRAP_PROJECT_ID: ${M2_BOOTSTRAP_PROJECT_ID:-b19b98b7-e715-42ca-b5af-02d665db48ad}
      M2_CSV_RETENTION_DAYS: ${M2_CSV_RETENTION_DAYS:-30}
      M2_OPERATIONS_POLL_MS: ${M2_OPERATIONS_POLL_MS:-60000}
      M2_RECOVERY_ENABLED: ${M2_RECOVERY_ENABLED:-false}
      M2_RECOVERY_SMTP_HOST: ${M2_RECOVERY_SMTP_HOST:-smtp.gmail.com}
      M2_RECOVERY_SMTP_PORT: ${M2_RECOVERY_SMTP_PORT:-587}
      M2_RECOVERY_SMTP_SECURITY: ${M2_RECOVERY_SMTP_SECURITY:-STARTTLS}
      M2_RECOVERY_SMTP_AUTH: ${M2_RECOVERY_SMTP_AUTH:-true}
      M2_RECOVERY_FROM: ${M2_RECOVERY_FROM:-}
      M2_RECOVERY_SMTP_USERNAME: ${M2_RECOVERY_SMTP_USERNAME:-}
      M2_RECOVERY_SMTP_PASSWORD: ${M2_RECOVERY_SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:${M2_HTTP_PORT:-8080}:8080"
    volumes:
      - m2_inputs:/app/data
    depends_on:
      database:
        condition: service_healthy
      database-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/health", "org.dataanaliticsent.Calidad.Docker.ContainerHealthcheck"]
      start_period: 60s
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped
volumes:
  m2_database:
  m2_inputs:
